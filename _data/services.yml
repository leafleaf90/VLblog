    faqs:
      - q: Kan du göra ett 3D-hus från en planritning?
        a: >-
          Ja. Jag bygger en 3D-modell i RoomSketcher från din 2D-planritning. Du
          får en genomgång och stillbilder. AI-rendering är valfritt om du vill
          ha en mer realistisk bild.
      - q: Vad är en 3D-planlösning hos dig?
        a: >-
          Samma rum som på ritningen, i 3D, så du kan klicka dig från rum till
          rum i stället för att gissa från en platt skiss.
      - q: Behöver jag en färdig arkitektritning?
        a: >-
          Nej. En PDF, en CAD-export eller ett foto av en skiss räcker för att
          börja. Mått hjälper. Ett känt rums mått räcker om ritningen saknar
          skala.
      - q: Gäller det nybygge eller renovering?
        a: >-
          Båda. Nybyggen är oftast en hel plan. Renoveringar är ofta ett plan,
          en tillbyggnad eller rummen du ska ändra.
      - q: Vad kostar ett 3D-hus från planritning?
        a: >-
          Från 500 €. Det är ett enkelt våningsplan, RoomSketcher-modellen och
          stillbilder. Ett helt hus eller AI-rendering kostar mer. Skriv så ger
          jag ett pris.
      - q: Hur skickar jag planritningen?
        a: >-
          Inte via formuläret. Formuläret är ett meddelande. Om uppdraget passar
          mejlar du ritningen efter det.
      - q: Behöver jag vara i närheten?
        a: >-
          Nej. Du mejlar filer, jag skickar tillbaka en modell och bilder.

- id: web-apps
  icon: app-window
  name: Nuxt web app development
  form_label: Web app development
  card_label: Web apps
  card_title: Custom web app
  card_summary: >-
    I build it, host it, pick a database that fits the project, set up
    deploys, and can keep it running after launch.
  permalink: /work/web-apps/
  cta_label: Ask about a web app
  featured_image:
  gallery: []
  related_slugs:
    - nuxt-tailwind-quick-start
    - nuxt-on-firebase
    - nuxt-on-vercel
    - firebase-emulator-functions
    - jamstack-forms-in-netlify
  faqs:
    - q: What stack do you use?
      a: >-
        Nuxt and Tailwind for the app. Hosting, database, and CI/CD depend on
        the project. Firebase is a common fit when it is. I will not add a
        fourth database because a blog post said to.
    - q: Do you also host it and set up a database?
      a: >-
        Yes. Hosting, storage, and a deploy pipeline are part of it, chosen
        for the use case.
    - q: Can you keep maintaining it after launch?
      a: >-
        Yes. Dependency updates, broken deploys, small features, the stuff that
        shows up once real people use it. Scope that separately from the build
        if you want, but it is on the menu.
    - q: How is this different from tech setup?
      a: >-
        Tech setup is a small stack you can run yourself: domain, email, maybe a
        simple site. A web app is custom software. If a form and a mailbox would
        do, start there.
  sv:
    name: Webbappar i Nuxt
    form_label: Webbapp
    card_label: Webbappar
    card_title: Skräddarsydd webbapp
    card_summary: >-
      Jag bygger den, hostar den, väljer en databas som passar, sätter upp
      deploys och kan hålla den igång efter lansering.
    cta_label: Fråga om en webbapp

- id: tech-setup
  icon: settings-2
  name: Tech setup for people and small businesses
  form_label: Tech setup
  card_label: Tech setup
  card_title: Domain, email, and a website
  card_summary: >-
    Domain and email on that domain, a small website if you need one, and AI
    only where it saves time. For people and small shops.
  permalink: /work/tech-setup/
  cta_label: Ask about a setup
  featured_image:
  gallery: []
  related_slugs:
    - getting-started-with-jekyll
    - jekyll-github-netlify
    - jamstack-forms-in-netlify
    - qr-without-the-nonsense
    - open-ai-api
  faqs:
    - q: What does tech setup actually include?
      a: >-
        Whatever you are missing from a short list: domain, email on that
        domain, a small website, and a restrained AI setup. We pick from that
        list. We do not install a drawer of mystery tools.
    - q: Is this only for companies?
      a: >-
        No. Regular people who want a personal site, sane email, or help
        choosing AI tools are the same job, just with less branding.
    - q: Will you just pick an AI tool and leave?
      a: >-
        I will tell you what is worth paying for and what to skip. If there is a
        real repeatable task, a simple agent can be part of it. If there is not,
        we stop.
    - q: Do I need a custom app?
      a: >-
        Usually not. A lot of "we need a platform" is a website, a form, and
        email that works. If you do need custom software, that is web app
        work, not this page.
  sv:
    name: Tech-setup för privatpersoner och småföretag
    form_label: Tech-setup
    card_label: Tech-setup
    card_title: Domän, e-post och en sajt
    card_summary: >-
      Domän och e-post på den, en liten webbplats om du behöver en, och AI
      bara där det sparar tid. För privatpersoner och småbutiker.
    cta_label: Fråga om en setup

- id: shopify-themes
  icon: store
  name: Custom Shopify theme development
  form_label: Shopify theme
  card_label: Shopify
  card_title: Custom Shopify theme
  card_summary: >-
    I start from Dawn and build a brand overlay on top.
  permalink: /work/shopify-themes/
  permalink_sv: /sv/anpassat-shopify-tema/
  cta_label: Ask about a theme
  featured_image:
  gallery: []
  related_slugs:
    - getting-started-with-jekyll
  faqs:
    - q: Do you build custom Shopify themes?
      a: >-
        Yes. I start from Dawn and build a brand overlay in its own files:
        product cards, cart drawer, header, product page.
    - q: Do you customize Dawn?
      a: >-
        Dawn stays the official theme. Custom work sits on top. A Dawn update
        is a short wire-up list.
    - q: Can you work on a store that is already live?
      a: >-
        Yes. Preview themes exist so the live store can stay up while we work.
        I need collaborator access and a list of apps that must keep working.
    - q: What happens when Shopify updates Dawn?
      a: >-
        Dawn files stay thin: an entrypoint or a class. I re-apply that
        wire-up.
    - q: What do you need to start?
      a: >-
        The current store or the designs, collaborator access, and a short list
        of what the theme must do. If you are not sure you need an overlay, say
        that first. Sometimes a smaller fix is enough.
  sv:
    name: Anpassade Shopify-teman
    form_label: Shopify-tema
    card_label: Shopify
    card_title: Anpassat Shopify-tema
    card_summary: >-
      Jag utgår från Dawn och bygger ett varumärkeslager ovanpå.
    cta_label: Fråga om ett tema
    faqs:
      - q: Bygger du anpassade Shopify-teman?
        a: >-
          Ja. Jag utgår från Dawn och bygger ett varumärkeslager i egna filer:
          produktkort, varukorgslåda, header, produktsida.
      - q: Anpassar du Dawn?
        a: >-
          Dawn förblir det officiella temat. Det egna arbetet ligger ovanpå.
          En Dawn-uppdatering är en kort inkopplingslista.
      - q: Kan du jobba på en butik som redan är live?
        a: >-
          Ja. Förhandsgranskningsteman finns så den publicerade butiken kan
          ligga kvar. Jag behöver medarbetaråtkomst och en lista på appar som
          måste fortsätta fungera.
      - q: Vad händer när Shopify uppdaterar Dawn?
        a: >-
          Dawn-filerna förblir tunna: en ingång eller en class. Jag gör om den
          inkopplingen.
      - q: Vad behöver du för att börja?
        a: >-
          Den nuvarande butiken eller designen, medarbetaråtkomst, och en kort
          lista på vad temat måste göra. Om du är osäker på om du behöver ett
          varumärkeslager, säg det först. Ibland räcker en mindre fix.
