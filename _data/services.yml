  related_slugs: []
  faqs:
    - q: Can you turn a 2D floor plan into a 3D house?
      a: >-
        Yes. I build a 3D model in RoomSketcher from your 2D floor plan. You
        get a walkthrough and stills. AI renditions are optional if you want a
        more realistic look.
    - q: Can I walk through the model?
      a: >-
        That is the point. You click from room to room instead of guessing from
        a flat drawing.
    - q: Do I need a finished architect drawing?
      a: >-
        No. A PDF, a CAD export, or a photo of a sketch is enough to start.
        Dimensions help. A known room size is enough if the drawing has no scale.
    - q: Is this for a new build or a renovation?
      a: >-
        Either. New builds are usually a full plan. Renovations are often one
        floor, an extension, or the rooms you are about to change.
    - q: How much does a 3D house from a floor plan cost?
      a: >-
        From €500. That is a straightforward floor, the RoomSketcher model and
        stills. A whole house or AI renders is more. Write and I will quote it.
    - q: How do I send the floor plan?
      a: >-
        Not through the form. The form is a note. If the job is a fit, you
        email the drawing after that.
    - q: Do I need to be nearby?
      a: >-
        No. You email files, I send a model and images back.
